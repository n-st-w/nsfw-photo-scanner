name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build.bat
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/NudityScanner.exe -Algorithm SHA256).Hash | Tee-Object dist/NudityScanner.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NudityScanner
          path: dist/NudityScanner.exe*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/NudityScanner.exe dist/NudityScanner.exe.sha256 --clobber
